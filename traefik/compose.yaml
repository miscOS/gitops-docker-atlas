name: traefik

networks:
  # macvlan:
  #   name: macvlan
  #   external: true
  traefik:
    name: traefik
    external: true

volumes:
  letsencrypt:

services:
  traefik:
    image: traefik:v3.7.17
    container_name: traefik
    hostname: traefik
    networks:
      # macvlan:
      #   ipv4_address: ${TRAEFIK_MACVLAN_IP:?error}
      #   mac_address: ${TRAEFIK_MAC:?error}
      traefik:
        ipv4_address: ${TRAEFIK_BRIDGE_IP:?error}
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: "Europe/Berlin"
      CLOUDFLARE_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?error}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/traefik:/logs:rw
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./routing.yaml:/etc/traefik/routing.yaml:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      errorpages: {condition: service_healthy}
    restart: unless-stopped
    labels:
      backup.enable: true
      backup.mode: live
      traefik.enable: true
      traefik.http.routers.traefik.rule: Host(`${TRAEFIK_URL:?error}`)
      traefik.http.routers.traefik.priority: 100
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.middlewares: local-ip-allow-list@file
      traefik.http.routers.traefik.service: api@internal

  errorpages:
    image: ghcr.io/tarampampam/error-pages:3.8.1
    container_name: traefik-errors
    hostname: traefik-errors
    networks:
      traefik:
    environment:
      TEMPLATE_NAME: lost-in-space
      LOG_FORMAT: console
      LOG_LEVEL: info
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.errorpages.rule: HostRegexp(`^(.+\.)?(${ERRORPAGES_DOMAINS:?error})$`)
      traefik.http.routers.errorpages.priority: 1
      traefik.http.routers.errorpages.entrypoints: websecure
      traefik.http.services.errorpages.loadbalancer.server.port: 8080