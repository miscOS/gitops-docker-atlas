# Global configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false
# Logging
log:
  level: DEBUG
  format: json
accesslog:
  filePath: /logs/access.log
  format: json
  dualOutput: true
  addInternals: true
# Dashboard and API
api:
  dashboard: true
  disabledashboardad: true
  insecure: false
# Healthcheck
ping: {}
# Providers
providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: ENC[AES256_GCM,data:WG/ZlUg=,iv:FU3x5F2hql2fleT1LSPTMsfUhgiBlrsI/FJPjjI/oBY=,tag:QkFBd5maELi7IoGFX5OYHw==,type:bool]
    network: traefik
  file:
    filename: /etc/traefik/routing.yaml
    watch: true
# EntryPoints
entryPoints:
  web:
    address: :80
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    http:
      aliasHeadersStrategy: delete
      middlewares:
        - errorpages@file
      tls:
        certResolver: letsencrypt
        domains:
          - main: ENC[AES256_GCM,data:R8Y4UGqgp4pw4T6VkYFO5Q==,iv:uNY2IhqFUnyD49v24u1dCcyuPDvXsrR92rFPZJGXij4=,tag:7Ljcz+sJc4Fw3GUbFhUPaA==,type:str]
            sans:
              - ENC[AES256_GCM,data:8+wGl731ZtaJ0LS53c+JUSnN,iv:WzR0NfpRNkawWG3vP5s1Mpdvt43xKaQgHbHf4u3rM+g=,tag:DXYa+wcLMd7V1Yk4nqvcXw==,type:str]
          - main: ENC[AES256_GCM,data:qDWpKb8oYK8goC8Ncg==,iv:ioSiMI3aKuluQ40pFI2Y9OiqFOnrQ1c0poUV/3/lUJA=,tag:CZm723Ia7HZCL9tbSAIi8Q==,type:str]
            sans:
              - ENC[AES256_GCM,data:KNQmZbApxyfvWJE51gOp,iv:d8V/e460RQ8GWykinihDqbigDgXmgNBgxOtyJJiASXI=,tag:zPK/IFQqn20IcYaUxJ/DjQ==,type:str]
# Let's Encrypt ACME
certificatesResolvers:
  letsencrypt:
    acme:
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53
          - 8.8.8.8:53
      email: ENC[AES256_GCM,data:1FbRgNsyV38FnAi2RxK/vldoPw==,iv:z2490xuzIGRBVr4QE1KZsl1miIFhaRSxS0/+bO+tfDk=,tag:oDNKhAfw12/MqqDWRklAkA==,type:str]
      storage: /letsencrypt/acme.json
# Plugins
experimental:
  plugins:
    ddns-allowlist:
      moduleName: github.com/taskmedia/ddns-allowlist
      version: v1.7.0
