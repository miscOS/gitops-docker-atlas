      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53
          - 8.8.8.8:53
      email: ENC[AES256_GCM,data:mPVbT2/Id+8LTdGFIK/1WzfA8g==,iv:L3uG8Lw0r9Tebeatqu7Ytywi/PYVyse8yHWLYtPgxeE=,tag:D3/qOCeSJYVZPhDi6b/g8g==,type:str]
