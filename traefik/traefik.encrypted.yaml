# Global configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false
# Logging
log:
  level: DEBUG
  format: json
accesslog:
  filePath: /logs/access.log
  format: json
  dualOutput: true
  addInternals: true
# Dashboard and API
api:
  dashboard: true
  disabledashboardad: true
  insecure: false
# Healthcheck
ping: {}
# Providers
providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: ENC[AES256_GCM,data:fIOa/sk=,iv:1y/TY/8QOg0TFmxZoi+qwjUz7kKXP+ZK/ozd6xIbexA=,tag:KDDGyXzvEf/ehVaxKq2c0w==,type:bool]
    network: traefik
  file:
    filename: /etc/traefik/routing.yaml
    watch: true
# EntryPoints
entryPoints:
  web:
    address: :80
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    http:
      aliasHeadersStrategy: delete
      middlewares:
        - errorpages@file
      tls:
        certResolver: letsencrypt
        domains:
          - main: ENC[AES256_GCM,data:G1H0jsIU1CZurX2flLn4ag==,iv:QUxM7Oa2ULc05cy/YlrdiH2RDaIk3gClqKM3L9hWZO0=,tag:UXN/5GLBIz4gg6xMRlukHw==,type:str]
            sans:
              - ENC[AES256_GCM,data:3SvFjxPVR0hovD1T//+07tWu,iv:EYswGqR8puI38hX+1Rgu5iquBlkTP/ejA5JsTFggtmM=,tag:EXMTGQEKcdKWKGVbqwgpKA==,type:str]
