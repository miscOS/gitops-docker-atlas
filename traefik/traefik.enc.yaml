# Global configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false
# Logging
log:
  level: DEBUG
  format: json
accesslog:
  filePath: /logs/access.log
  format: json
  dualOutput: true
  addInternals: true
# Dashboard and API
api:
  dashboard: true
  disabledashboardad: true
  insecure: false
# Healthcheck
ping: {}
# Providers
providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: ENC[AES256_GCM,data:zO456oE=,iv:S6Vnut3RMRxL2r6Dix+yWDvoCjD7BzHwFxSB572SbV4=,tag:fhnaIi8MehoSlNPQ7JFNdw==,type:bool]
    network: traefik
  file:
    filename: /etc/traefik/routing.yaml
    watch: true
# EntryPoints
entryPoints:
  web:
    address: :80
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    http:
      aliasHeadersStrategy: delete
      middlewares:
        - errorpages@file
      tls:
        certResolver: letsencrypt
        domains:
          - main: ENC[AES256_GCM,data:rpvSje7HYPPDbyNjndH/ZA==,iv:oXqEYbtvruAoa9NnMj25bf09bE4EqDSl88uDEF1RlCg=,tag:gdbA96tRd5kpxTXfG9kzew==,type:str]
            sans:
              - ENC[AES256_GCM,data:Y3jFkwk95GxQWYG8BaSlq7ve,iv:IAfSP39f2XvmdTAaj2Vmrf6GvaMCpGU1UzNgj+n647Q=,tag:syj8ugjcLmpTlHG5lIh1Lw==,type:str]
