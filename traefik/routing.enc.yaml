http:
  # MIDDLEWARES
  middlewares:
    # Allow access via Local IPs
    local-ip-allow-list:
      plugin:
        ddns-allowlist:
          sourceRangeHosts:
            - ENC[AES256_GCM,data:+UM6ZGhpl5SW5h4UupQIzDi2Z4xyfc/h,iv:Q5HqnsxdlD5cn4gaviSlXLmu2GFqiovu6FG1y6ssIr4=,tag:Tw54t4+6efuQ7wJUvjGEZA==,type:str]
          sourceRangeIps:
            - 127.0.0.1/32
            - 172.16.0.0/12
            - 10.0.0.0/16
    # Error pages
    errorpages:
      errors:
        status:
          - 400-599
        service: errorpages@docker
        query: /{status}.html
  # ROUTERS
  routers:
    # AdGuard
    adguard:
      rule: ENC[AES256_GCM,data:1op+6BnDE31ATheieH2WEeaq7cveWwCfsdXkb2I=,iv:tyxda7RPd13uA/7e7Xs0NPW10CyekdGl5i9JHUpkzdk=,tag:mbprt+wfX9SkClWv69foXw==,type:str]
      entryPoints:
        - websecure
      middlewares:
        - local-ip-allow-list@file
      service: adguard@file
      priority: 30
    # TrueNAS
    truenas:
      rule: ENC[AES256_GCM,data:mNE2ajDaEPSbkXqYc6VoxpxTFb9WCDI/9i5BFbSdKQfCPXoRjQPwgKsax6erD4T5WBGQ2U5a2+zRTg==,iv:FulicFqRH97XkVx4JQY1liPHjzpK2LduFOWbvJwb6Ts=,tag:5nG9R9cpECEN708saB+KDw==,type:str]
      entryPoints:
        - websecure
      middlewares:
        - local-ip-allow-list@file
      service: truenas@file
      priority: 65
    # Proxmox
    proxmox:
      rule: ENC[AES256_GCM,data:XY6B8y8SuFO2ZBt237IM7tMNmSZmEymoSuWX9L/z338qxI4arBM1bS0Wv6uaFCHtY24O3bXzm2VYdA==,iv:PPv1B8jaeOsfdXBKeR960ysEO5ZGEbee8JrZEEsR91E=,tag:LEEaqYm9v6D8V15ulAVGkQ==,type:str]
      entryPoints:
        - websecure
      middlewares:
        - local-ip-allow-list@file
      service: proxmox@file
      priority: 90
  # SERVICES
  services:
    # AdGuard
    adguard:
      loadBalancer:
        servers:
          - url: ENC[AES256_GCM,data:naWm2Mj32ptz+k2uQWJGXq0wiJoK,iv:EzVkVd6kHKyzW6xptxF45uQmpa/hRBBygKiGvNVc+aQ=,tag:I3Nl1LnYumbonvVneZMA6g==,type:str]
    # TrueNAS
    truenas:
      loadBalancer:
        servers:
          - url: ENC[AES256_GCM,data:5JIkRaFfoUmLjpFLro1/AGbo4bOM,iv:UuoOzArYp1IKLbFJgNjUDvBHmrSEhsnrwJ0F65qenQk=,tag:7DUE+YZ4IwxJU8YiLoLjfw==,type:str]
        passHostHeader: true
    # Proxmox
    proxmox:
      loadBalancer:
        serversTransport: insecure
        servers:
          - url: ENC[AES256_GCM,data:K2KK7typVvMxVcCAeTliLjh6CfZuzw==,iv:ud97TVdwFZu1valBoenOg5+PgSVThE38331emfBeIno=,tag:4m4007eSdEL9TMUCRvDxPw==,type:str]
  # SERVERS TRANSPORTS
  serversTransports:
    # Allow self signed certificates
    insecure:
      insecureSkipVerify: true
