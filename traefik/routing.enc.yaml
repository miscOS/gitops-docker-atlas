http:
  # MIDDLEWARES
  middlewares:
    # Allow access via Local IPs
    local-ip-allow-list:
      plugin:
        ddns-allowlist:
          sourceRangeHosts:
            - ENC[AES256_GCM,data:S2s9SXo4uKA3Lk7arnpZvnV9kTitCFL77cJh,iv:oZkjFIhArvbJD6K0iK9FI0oGlTo2yNdKtjtAPeJrLTw=,tag:vSpZNw2gjxtz7CzVpdPwew==,type:str]
            - ENC[AES256_GCM,data:NKoGdBAxq/2QuUjqWsW4bFiwUsFn1RUn,iv:lMCwCRL1ir2x0RQfI9bjOz22/NnFi6qh1eMRXHAl/dA=,tag:g7GLnFbSp9FEbbREj9WPbA==,type:str]
          sourceRangeIps:
            - 127.0.0.1/32
            - 172.16.0.0/12
            - 10.0.0.0/16
    # Error pages
    errorpages:
      errors:
        status:
          - 400-599
        service: errorpages@docker
        query: /{status}.html
  # ROUTERS
  routers:
    # AdGuard
    adguard:
      rule: ENC[AES256_GCM,data:QAw5kL7Bk7NkUJpgSUNxTn9l0NhHHYzhoSj6JUD32kIufrCO7um4QZhVN74UVYziMeYXZ/IqpUeY,iv:PdSaK4KXepsHyb9X+EXJcHya90ZFexWRr/2+AmcNmgo=,tag:Gt4uUPSAiH82mqiDcZWKhg==,type:str]
      entryPoints:
        - websecure
      middlewares:
        - local-ip-allow-list@file
      service: adguard@file
    # forgejo
    # forgejo:
    #   rule: Host(`forgejo.miscos.dev`) || Host(`git.miscos.dev`)
    #   entryPoints:
    #     - websecure
    #   middlewares:
    #     - local-ip-allow-list@file
    #   service: forgejo@file
    # TrueNAS
    truenas:
      rule: ENC[AES256_GCM,data:QDDnWg3GnGJimShC7r+5C957Ne9oqwEeKQb9/XSbAJcwMahUIbBbhX6PDFPRp8+i3zduuyjRvzoG6Q==,iv:MWlmeDSnh4MCfmMTC1k3IW/8XO9ypOlvIGg07wa158M=,tag:8tkJqhbcbdhbyfMS/oPO4g==,type:str]
      entryPoints:
        - websecure
      middlewares:
        - local-ip-allow-list@file
      service: truenas@file
    # Proxmox
    proxmox:
      rule: ENC[AES256_GCM,data:nBTjlfOjIcVm0QJIqLgYXTyqcD/NAVBAKsDlavq5KBUA/ADT5pgBSkJhMNZF6xKhLtQZXOA0Yx+Zhw==,iv:e3EC8xCehQdoQMteS/8OQ2sJ8txXhx2bTDplY2cNyOs=,tag:hRs/4X0I076ku6KKB70DKQ==,type:str]
      entryPoints:
        - websecure
      middlewares:
        - local-ip-allow-list@file
      service: proxmox@file
  # SERVICES
  services:
    # Error pages
    errorpages:
      loadBalancer:
        servers:
          - url: ENC[AES256_GCM,data:EyGmfeYuJqEyk+L9p+xb/B7di5ozrPdTxTU=,iv:abv3x2Or6/MlsdV+1U+hzch9jS2NG4JZJFfAPP5ysmQ=,tag:/U0GxtbFwFJpscCqtuFmNA==,type:str]
    # AdGuard
    adguard:
      loadBalancer:
        servers:
          - url: ENC[AES256_GCM,data:xoCv81gcjBrG4majTV1jbzSUtny5,iv:IilqsDWGDJrgeU6wax0wJzScmMOxH53kEgb1dFgjNDM=,tag:Uy7C95MlDpdEc6D9Msm3OA==,type:str]
    # forgejo
    # forgejo:
    #   loadBalancer:
    #     servers:
    #       - url: http://10.0.100.10:3000
    # TrueNAS
    truenas:
      loadBalancer:
        servers:
          - url: ENC[AES256_GCM,data:aMkeVMxBpvn+mXY6iIlf8cbzPJOS,iv:eXCbowkzfirQUMIkRhTeIUl7v2Srb9dkcDUZWguVZVw=,tag:PtSFnHHYn5/oEEi8489txw==,type:str]
        passHostHeader: true
    # Proxmox
    proxmox:
      loadBalancer:
        serversTransport: insecure
        servers:
          - url: ENC[AES256_GCM,data:5R5QYICcKAqFZ3xn4hbZSAuxCy4GDw==,iv:T+UorcOwG8UjiLCAU9KLGveBKnYOe3IafzrBLp7am34=,tag:kkPDLBQzl3OQIl7sqQU9ew==,type:str]
  # SERVERS TRANSPORTS
  serversTransports:
    # Allow self signed certificates
    insecure:
      insecureSkipVerify: true
