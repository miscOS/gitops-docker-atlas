      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53
          - 8.8.8.8:53
      email: ENC[AES256_GCM,data:w8ZgHMuolVAbSMYXWZTaFO+hzw==,iv:8z3l7yuPSgY320yfchwJTptHH9y1j12mYll0oEZY1sA=,tag:iLA7V57oWUANALzV/8fFig==,type:str]
