http:
  # MIDDLEWARES
  middlewares:
    # Allow access via Local IPs
    local-ip-allow-list:
      plugin:
        ddns-allowlist:
          sourceRangeHosts:
            - ENC[AES256_GCM,data:aaKoHPsGlb+QZi1huMCz1t3b8MJ+Gu9oACGq,iv:c0niZ1WJ/LAXA4I/oBbMIhxcsUvn45TIyhZSTCOIDk8=,tag:2GBH654Y45m1eaENWulkpQ==,type:str]
            - ENC[AES256_GCM,data:rkocA7tqmNYf4G+ymfYzYPbwj+1lPPrV,iv:GcH/5Nz3pGmHv8typrZfYKbADfs96g9UD3CQRtDwBz0=,tag:KncHKukHR3SQM2/i/ACiWA==,type:str]
          sourceRangeIps:
            - 127.0.0.1/32
            - 172.16.0.0/12
            - 10.0.0.0/16
    # Error pages
    errorpages:
      errors:
        status:
          - 400-599
        service: errorpages@docker
        query: /{status}.html
  # ROUTERS
  routers:
    # AdGuard
    adguard:
      rule: ENC[AES256_GCM,data:GHMZkP6KuP+3owyEfewP3hPgf9afn/IwRjStBB0=,iv:A5uiddEgMVsjQP/Mnd5xYri0P+r8qoeh/kBMjWyoDtk=,tag:GKjdPPaqDaBdZNDI2/XFiQ==,type:str]
      entryPoints:
        - websecure
      middlewares:
        - local-ip-allow-list@file
      service: adguard@file
      priority: 30
    # TrueNAS
    truenas:
      rule: ENC[AES256_GCM,data:AccBhoHFdFF4ARpIZtM1iA26XScz/yUJOQkwQ71bvf2nseIfNFCjLXvrBDqF7dvPsX52+onIlfv+FA==,iv:yJAvG9avS9zTHDPcdOtLwu8x9B9MCMHSOlg/uZei3aA=,tag:Yr3m0psr8QW5yYkShBSGAg==,type:str]
      entryPoints:
        - websecure
      middlewares:
        - local-ip-allow-list@file
      service: truenas@file
      priority: 65
    # Proxmox
    proxmox:
      rule: ENC[AES256_GCM,data:Hk/5WYwG/ObATWo6wmuuco5oyPbBblNuzOywz+IwzhwpCPzJvQBUJIj6prheeM+aQkCjr4JHQOJsQw==,iv:V57DcO1MhFh7CnYz9ekN4FP7X8fLqOrIgDBbVNVEWrU=,tag:Dp+GzadPaZPZQEOFmqCj7g==,type:str]
      entryPoints:
        - websecure
      middlewares:
        - local-ip-allow-list@file
      service: proxmox@file
      priority: 90
  # SERVICES
  services:
    # AdGuard
    adguard:
      loadBalancer:
        servers:
          - url: ENC[AES256_GCM,data:bdYgrPN9iAcX5GfWkAySdMD0gRWB,iv:USBq2aERjUt6j0YcMidPBkJe/vCklWJ/5YUjAVa6xlA=,tag:BJ0YPMVS/M6mafKGowtv2w==,type:str]
    # TrueNAS
    truenas:
      loadBalancer:
        servers:
          - url: ENC[AES256_GCM,data:NwYOnLYkpmMyeefOzYFj+abJxV1e,iv:XNceMA/sebjInGKcdE8ycfS9JkWKTPy2wVrmLbPblZg=,tag:wxKYBjOPNcfeGoJZUh7jYw==,type:str]
        passHostHeader: true
    # Proxmox
    proxmox:
      loadBalancer:
        serversTransport: insecure
        servers:
          - url: ENC[AES256_GCM,data:gQYIyvv4IwOaUO++E87ip1vBIz+zjQ==,iv:EAugQ/3Jt141LebAl+mBnOOqj0o8b3vkQ5e+p+6D83k=,tag:5R5H9IdDImfIR/4wQGfPdg==,type:str]
  # SERVERS TRANSPORTS
  serversTransports:
    # Allow self signed certificates
    insecure:
      insecureSkipVerify: true
